<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ingresar — Sistema Electoral FCB UNSAAC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --azul:       #1A5276;
      --azul-hover: #154560;
      --texto:      #0F172A;
      --muted:      #64748B;
      --borde:      #E2E8F0;
      --fondo:      #F8FAFC;
      --blanco:     #FFFFFF;
      --error:      #DC2626;
      --error-bg:   #FEF2F2;
      --radio:      8px;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--fondo);
      color: var(--texto);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      -webkit-font-smoothing: antialiased;
    }

    .contenedor {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    /* Encabezado */
    .cabecera { text-align: center; }

    .cabecera-escudo {
      width: 48px;
      height: 48px;
      background: var(--azul);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1rem;
    }

    .cabecera-escudo svg { width: 24px; height: 24px; fill: white; }

    .cabecera h1 {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--texto);
      margin-bottom: 4px;
    }

    .cabecera p {
      font-size: 13px;
      color: var(--muted);
    }

    /* Tarjeta */
    .tarjeta {
      background: var(--blanco);
      border: 1px solid var(--borde);
      border-radius: 12px;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    /* Campos */
    .campo { display: flex; flex-direction: column; gap: 6px; }

    .campo label {
      font-size: 13px;
      font-weight: 500;
      color: var(--texto);
    }

    .campo input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--borde);
      border-radius: var(--radio);
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      color: var(--texto);
      background: var(--blanco);
      transition: border-color 0.15s, box-shadow 0.15s;
      outline: none;
    }

    .campo input:focus {
      border-color: var(--azul);
      box-shadow: 0 0 0 3px rgba(26, 82, 118, 0.1);
    }

    /* Mensaje de error */
    .error-msg {
      display: none;
      background: var(--error-bg);
      border: 1px solid #FECACA;
      border-radius: var(--radio);
      padding: 10px 14px;
      font-size: 13px;
      color: var(--error);
    }

    .error-msg.visible { display: block; }

    /* Botón */
    .btn-submit {
      width: 100%;
      padding: 11px;
      background: var(--azul);
      color: white;
      border: none;
      border-radius: var(--radio);
      font-size: 14px;
      font-weight: 500;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: background 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-submit:hover:not(:disabled) { background: var(--azul-hover); }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }

    .spinner {
      display: none;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    .btn-submit.cargando .spinner { display: block; }
    .btn-submit.cargando .btn-texto { display: none; }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Pie */
    .pie {
      text-align: center;
      font-size: 13px;
      color: var(--muted);
    }

    .pie a {
      color: var(--azul);
      text-decoration: none;
      font-weight: 500;
    }

    .pie a:hover { text-decoration: underline; }

    .separador {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      position: relative;
    }

    .separador::before, .separador::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 40%;
      height: 1px;
      background: var(--borde);
    }

    .separador::before { left: 0; }
    .separador::after  { right: 0; }

    .volver {
      text-align: center;
      font-size: 13px;
    }

    .volver a {
      color: var(--muted);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .volver a:hover { color: var(--texto); }
  </style>
</head>
<body>

  <div class="contenedor">

    <div class="cabecera">
      <div class="cabecera-escudo" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.5 2 2 6.5 2 12c0 4.2 2.6 7.8 6.3 9.3C7.6 19.6 7 17.3 7 15c0-5.5 4.5-10 10-10-.5-.6-1-1.1-1.6-1.5C14.1 2.5 13.1 2 12 2z"/><path d="M17 5c-5.5 0-10 4.5-10 10 0 2.3.8 4.5 2.1 6.2C10.7 22.4 12.3 23 14 23c5.5 0 10-4.5 10-10 0-1.7-.5-3.3-1.2-4.7C21.3 6.4 19.3 5 17 5z"/></svg>
      </div>
      <h1>Ingresar al sistema</h1>
      <p>Centro Federado FCB · UNSAAC</p>
    </div>

    <div class="tarjeta">
      <div class="error-msg" id="error-msg" role="alert"></div>

      <div class="campo">
        <label for="email">Correo electrónico</label>
        <input
          type="email"
          id="email"
          name="email"
          autocomplete="email"
          placeholder="tu@correo.com"
          required
        />
      </div>

      <div class="campo">
        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          name="password"
          autocomplete="current-password"
          placeholder="••••••••"
          required
        />
      </div>

      <button class="btn-submit" id="btn-login" type="button">
        <span class="spinner" aria-hidden="true"></span>
        <span class="btn-texto">Ingresar</span>
      </button>

      <div class="separador">o</div>

      <div class="pie">
        ¿Aún no tienes expediente?
        <a href="inscripcion.html">Crear nueva inscripción</a>
      </div>
    </div>

    <div class="volver">
      <a href="index.html">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        Volver al portal
      </a>
    </div>

  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // Redirigir si ya tiene sesión
    if (Auth.estaAutenticado()) {
      window.location.href = 'expediente.html';
    }

    const btnLogin  = document.getElementById('btn-login');
    const errorMsg  = document.getElementById('error-msg');
    const inputEmail = document.getElementById('email');
    const inputPass  = document.getElementById('password');

    function mostrarError(msg) {
      errorMsg.textContent = msg;
      errorMsg.classList.add('visible');
    }

    function ocultarError() {
      errorMsg.classList.remove('visible');
    }

    async function login() {
      ocultarError();
      const email    = inputEmail.value.trim();
      const password = inputPass.value;

      if (!email || !password) {
        mostrarError('Completa todos los campos para continuar.');
        return;
      }

      btnLogin.classList.add('cargando');
      btnLogin.disabled = true;

      try {
        const data = await API.post('auth.login', { email, password });
        Auth.guardarSesion(data.token, data.usuario);
        window.location.href = 'expediente.html';
      } catch (err) {
        mostrarError(err.message || 'No se pudo iniciar sesión. Verifica tus datos.');
      } finally {
        btnLogin.classList.remove('cargando');
        btnLogin.disabled = false;
      }
    }

    btnLogin.addEventListener('click', login);

    [inputEmail, inputPass].forEach(input => {
      input.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
      input.addEventListener('input', ocultarError);
    });
  </script>
</body>
</html>
